services:
  mcp-server:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      PIPELINE_OUTPUT_DIR: /data/pipeline
      LOG_FILE_PATH: /data/app.log
      LOG_MAX_LINES: "3000"
    volumes:
      - mcp-data:/data
    restart: unless-stopped

volumes:
  mcp-data:
