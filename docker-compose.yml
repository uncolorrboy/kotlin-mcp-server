services:
  mcp-server:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      HOST: 0.0.0.0
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      TASK_STORE_PATH: /data/scheduler.db
      LOG_FILE_PATH: /data/app.log
      LOG_MAX_LINES: "3000"
    volumes:
      - scheduler-data:/data
    restart: unless-stopped

volumes:
  scheduler-data:
